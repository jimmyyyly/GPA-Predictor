<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPA Predictor</title>
  <style>
    :root { --bg: #f6f7fb; --card: #fff; --text: #1c1e26; --muted: #6b7080; --accent: #4f46e5; --border: #e3e5ec; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14151a; --card: #1e2028; --text: #e8e9ee; --muted: #9a9fb0; --accent: #818cf8; --border: #2e313c; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
           color: var(--text); font-family: system-ui, -apple-system, Segoe UI, sans-serif; padding: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
            padding: 28px; width: 100%; max-width: 380px; }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: .9rem; }
    label { display: block; font-size: .85rem; color: var(--muted); margin: 12px 0 4px; }
    input { width: 100%; padding: 10px 12px; font-size: 1rem; border-radius: 8px;
            border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    button { margin-top: 20px; width: 100%; padding: 11px; font-size: 1rem; border: 0;
             border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    #result { margin-top: 22px; text-align: center; min-height: 3.5rem; }
    #gpa { font-size: 2.4rem; font-weight: 700; }
    .foot { margin-top: 16px; font-size: .75rem; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <h1>GPA Predictor</h1>
    <p class="sub">Estimate college GPA from SAT section scores.</p>
    <label for="math">Math SAT (200–800)</label>
    <input id="math" type="number" min="200" max="800" value="650" required>
    <label for="verbal">Verbal SAT (200–800)</label>
    <input id="verbal" type="number" min="200" max="800" value="600" required>
    <button type="submit">Predict</button>
    <div id="result"></div>
    <div class="foot" id="foot"></div>
  </form>
  <script>
    const result = document.getElementById("result");
    fetch("/metrics").then(r => r.json()).then(m => {
      document.getElementById("foot").textContent =
        `Model: ${m.model} · test R² ${m.test_r2} · avg error ±${m.test_mae}`;
    });
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = {
        math_sat: +document.getElementById("math").value,
        verbal_sat: +document.getElementById("verbal").value,
      };
      const res = await fetch("/predict", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      if (!res.ok) { result.textContent = "Invalid input"; return; }
      const data = await res.json();
      result.innerHTML = `<div id="gpa">${data.predicted_gpa.toFixed(2)}</div><div class="sub">predicted GPA</div>`;
    });
  </script>
</body>
</html>
